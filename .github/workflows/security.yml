name: Security and release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify community distribution
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Lint PHP
        shell: bash
        run: find openbooking-wp -type f -name '*.php' -print0 | xargs -0 -n1 php -l
